# Staging never adds a project to packwiz. Promotion requires an audit, an exact
# stable Fabric 26.2 pin, dependency closure, and a deliberate collection edit.
schema = 1

# Future [[candidate]] tables require:
# project-id, slug, category, rationale, status, client-only, target-support,
# blockers, promotion-criteria. Use nonempty strings or lists for those fields.
# Example status values: proposed, blocked, ready-for-review.
# Excluded requested features are recorded in collection.toml, not staged here.

[[candidate]]
project-id = "jlNms3Jp"
slug = "configmanager"
category = "pack-management"
rationale = "Ship first-install defaults without overwriting personal settings on pack updates."
status = "blocked"
client-only = "Unresolved metadata conflict: native Fabric environment is universal and source copies local files; Modrinth v2 marks client unsupported and server required."
target-support = "Release 1.1.4 (okecULrz) lists Fabric 26.2; native Minecraft range is >=26.1."
blockers = ["Reconcile upstream client/server metadata before activation; do not bypass the current client-only validator.", "Verify first-install, existing-file preservation, and explicit update/reset behavior in a disposable profile."]
promotion-criteria = ["Exact release and official dependency closure pass the unchanged client-only checks.", "Move intended defaults under config/modpack_defaults and verify updates preserve personal settings."]
evidence = ["https://api.modrinth.com/v2/project/jlNms3Jp", "https://api.modrinth.com/v2/version/okecULrz", "https://modrinth.com/mod/configmanager", "docs/mod-audit.md#staged-investigations", "docs/configuration.md#defaults-manager-evaluation-2026-11-19"]
checked-at = "2026-11-19"

